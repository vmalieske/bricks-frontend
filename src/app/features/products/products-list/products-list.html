<div class="products-page">
  <div class="products-page__header">
    @if (isWishlist()) {
      <button mat-stroked-button (click)="updateAllPrices()" [disabled]="updatingPrices()">
        <mat-icon>sync</mat-icon>
        @if (updatingPrices()) {
          Wird aktualisiert...
        } @else {
          Preis aktualisieren
        }
      </button>
    }
  </div>

  @if (loading()) {
    <div class="loading-state">
      <mat-spinner />
    </div>
  } @else if (error()) {
    <div class="error-state">
      <p>{{ error() }}</p>
    </div>
  } @else if (products().length === 0) {
    <div class="empty-state">
      <p>There are no Sets yet.</p>
    </div>
  } @else {
    <div class="products-grid">
      @for (product of products(); track product.id) {
        <app-product-card
          [product]="product"
          (edit)="navigateToEdit(product.id)"
          (delete)="deleteProduct(product.id)"
          (navigate)="navigateToDetail(product.id)"
        />
      }
    </div>
  }

  <button mat-fab class="fab" (click)="navigateToNewProduct()">
    <mat-icon>add</mat-icon>
  </button>
</div>
